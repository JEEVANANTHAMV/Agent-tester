[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forjinn-eval"
version = "0.1.0"
description = "Unit-test-style evaluation and testing toolkit for Forjinn visual-canvas agents. Run an agent, capture the full node-by-node execution trace (tool calls, token usage, timing), and assert cumulative metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forjinn" }]
keywords = ["llm", "agent", "evaluation", "testing", "forjinn", "ragas", "deepeval", "pytest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "httpx>=0.24", "rapidfuzz>=3.0"]
# Levenshtein-based string similarity (falls back to Jaccar if absent)
text = ["rapidfuzz>=3.0"]

[project.scripts]
forjinn-eval = "forjinn_eval.cli:main"

[project.entry-points."pytest11"]
forjinn_eval = "forjinn_eval.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: real-LLM tests against a live Forjinn host (opt-in via FORJINN_LLM_TESTS=1)",
]
