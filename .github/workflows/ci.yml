name: forjinn-eval CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run unit suite (offline fixtures)
        run: pytest -q
      - name: Smoke (offline recorded samples)
        run: forjinn-eval smoke --report out/smoke.json
      - name: Registered cases (offline)
        env:
          FORJINN_OFFLINE: "1"
        run: |
          forjinn-eval run examples/agent_tests.py --report-json out/report.json --report-xml out/report.xml --min-pass-rate 1.0 --fail-on-gate

  live:
    # Optional live e2e against a real Forjinn builder, only when secrets are set.
    needs: test
    if: ${{ secrets.FORJINN_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Run a live smoke predict + eval
        env:
          FORJINN_HOST: ${{ secrets.FORJINN_HOST }}
          FORJINN_AGENT_NO_TOOLS: ${{ secrets.FORJINN_AGENT_NO_TOOLS }}
          FORJINN_AGENT_WITH_MCP: ${{ secrets.FORJINN_AGENT_WITH_MCP }}
        run: |
          python - <<'PY'
          import sys
          from forjinn_eval import ForjinnClient, AllNodesFinished, OutputNotEmpty, make_case, SuiteRunner
          import os
          host = os.environ["FORJINN_HOST"]
          c = ForjinnClient(host)
          q = "Count from 1 to 5, one number per line."
          run = c.predict(os.environ["FORJINN_AGENT_NO_TOOLS"], q)
          sr = SuiteRunner(suite_name="live-ci").run([make_case("live", run, [AllNodesFinished(), OutputNotEmpty()], tags=["live"])])
          print(sr.to_markdown())
          assert sr.failed == 0 and sr.errors == 0
          PY

  live-llm:
    # Optional: run the REAL-LLM suite (JudgeClient -> Forjinn SSE) against a
    # live host + a Forjinn agent built as an LLM judge. Only when the judge
    # chatflow secret is set.
    needs: test
    if: ${{ secrets.FORJINN_JUDGE_CHATFLOW != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Run the real-LLM judge suite (-m live)
        env:
          FORJINN_LLM_TESTS: "1"
          FORJINN_HOST: ${{ secrets.FORJINN_HOST }}
          FORJINN_TOKEN: ${{ secrets.FORJINN_TOKEN }}
          FORJINN_JUDGE_CHATFLOW: ${{ secrets.FORJINN_JUDGE_CHATFLOW }}
          FORJINN_JUDGE_STREAMING: "1"
        run: pytest -m live -q -v
