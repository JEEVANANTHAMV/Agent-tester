name: release

# Cut a release from a git tag.
#
#   git tag -a v0.2.0 -m "v0.2.0 - expanded metric catalog"
#   git push origin v0.2.0
#
# This builds the sdist + wheel (version derived from the tag via
# setuptools-scm), publishes it as a GitHub Release, and - if a PYPI_API_TOKEN
# repo secret is set - uploads to PyPI.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags for setuptools-scm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Show build artifacts
        run: ls -la dist/

      - name: Create GitHub Release (and upload artifacts)
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || true }}

      - name: Upload to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine check dist/*
          twine upload dist/*
